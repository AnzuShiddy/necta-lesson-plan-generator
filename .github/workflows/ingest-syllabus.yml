name: Ingest TIE syllabus

# Manual only. Ingestion calls the Gemini API and rewrites curriculum data, so
# it must never fire on push — the output is model-transcribed and needs a human
# to review the diff before it lands.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: Subject to ingest
        required: true
        type: choice
        default: Geography
        options:
          - Geography
          - History
          - Physics
          - Mathematics
          - Biology
          - Chemistry
          - Computer Science
          - Kiswahili
          - English Language
          - Literature in English
          - Business Studies
          - Bible Knowledge
          - Elimu ya Dini ya Kiislamu
          - Historia ya Tanzania na Maadili
          - (every subject)
      model:
        description: "Gemini model override (blank = repo default)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingest-syllabus
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download TIE syllabus PDFs
        # The PDFs are gitignored, so the runner has to fetch them from the
        # URLs in data/sources.json before anything can be ingested.
        run: |
          if [ "${{ inputs.subject }}" = "(every subject)" ]; then
            python scripts/download_syllabus_pdfs.py --all
          else
            python scripts/download_syllabus_pdfs.py "${{ inputs.subject }}"
          fi

      - name: Ingest syllabus
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_INPUT: ${{ inputs.model }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set on this repository."
            exit 1
          fi
          # Only export the override when one was actually given — an empty
          # LESSONPLAN_MODEL is not the same as an unset one.
          if [ -n "$MODEL_INPUT" ]; then
            export LESSONPLAN_MODEL="$MODEL_INPUT"
          fi
          echo "Model: ${LESSONPLAN_MODEL:-<repo default>}"
          # --force is required: every subject already has a JSON file.
          # Forms rebuilt from a teacher scheme carry a "source" block and are
          # preserved by the script regardless.
          if [ "${{ inputs.subject }}" = "(every subject)" ]; then
            python scripts/ingest_syllabus.py --all --force
          else
            python scripts/ingest_syllabus.py "${{ inputs.subject }}" --force
          fi

      - name: Rebuild scheme snapshots
        run: python scripts/build_schemes.py

      - name: Summarise the change
        id: summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, subprocess
          changed = subprocess.run(
              ["git", "diff", "--name-only", "--", "data/syllabus"],
              capture_output=True, text=True).stdout.split()
          print("## Ingestion result\n")
          if not changed:
              print("No change to `data/syllabus`.")
          for path in changed:
              d = json.load(open(path))
              print(f"### {d['subject']}\n")
              print("| Form | Activities | Source |")
              print("|---|---|---|")
              for form, fd in d["forms"].items():
                  src = "teacher scheme (preserved)" if fd.get("source") else "TIE transcription"
                  print(f"| {form} | {len(fd['activities'])} | {src} |")
              print()
          PY

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/syllabus data/schemes; then
            echo "No data changed — nothing to open a PR for."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          slug=$(echo "${{ inputs.subject }}" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')
          branch="ingest/${slug}-${{ github.run_id }}"
          git checkout -b "$branch"
          git add data/syllabus data/schemes
          git commit \
            -m "Re-ingest ${{ inputs.subject }} from the TIE syllabus PDF" \
            -m "Regenerated by the ingest-syllabus workflow (run ${{ github.run_id }}). Content is model-transcribed from the official TIE PDF and needs to be spot-checked against the source document before merging."
          git push -u origin "$branch"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > /tmp/pr-body.md <<EOF
          Regenerated by \`ingest-syllabus\` ([run]($run_url)).

          **Review before merging.** The activity rows are transcribed from the
          official TIE PDF by the model, and the Form-splitter is best-effort —
          check that each Form is populated and that the competences match the
          source document.

          Forms rebuilt from a teacher-authored scheme of work are preserved,
          not re-ingested.
          EOF
          sed -i 's/^          //' /tmp/pr-body.md
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Re-ingest ${{ inputs.subject }} from the TIE syllabus PDF" \
            --body-file /tmp/pr-body.md
